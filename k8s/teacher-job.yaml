# Two workers at once (indexed Job: index 0 and 1) in namespace `pipeline`.
# Ollama runs on the laptop (host): `OLLAMA_HOST=0.0.0.0 ollama serve` + `ollama pull phi3.5`.
apiVersion: batch/v1
kind: Job
metadata: {name: teacher-labelling, namespace: pipeline}
spec:
  completionMode: Indexed
  completions: 2
  parallelism: 2
  backoffLimit: 20
  template:
    spec:
      restartPolicy: OnFailure
      containers:
        - name: worker
          image: teacher-worker:local
          imagePullPolicy: IfNotPresent
          env:
            - name: SHARD_INDEX
              valueFrom: {fieldRef: {fieldPath: "metadata.annotations['batch.kubernetes.io/job-completion-index']"}}
            - {name: SHARD_COUNT, value: "2"}
            - {name: S3_ENDPOINT, value: "http://seaweedfs-s3.data.svc.cluster.local:8333"}
            - {name: OLLAMA_URL, value: "http://host.k3d.internal:11434"}
            - name: AWS_ACCESS_KEY_ID
              valueFrom: {secretKeyRef: {name: s3-credentials, key: AWS_ACCESS_KEY_ID}}
            - name: AWS_SECRET_ACCESS_KEY
              valueFrom: {secretKeyRef: {name: s3-credentials, key: AWS_SECRET_ACCESS_KEY}}
          resources: {requests: {cpu: 50m, memory: 64Mi}, limits: {memory: 256Mi}}
