# Single-node SeaweedFS (master+volume+filer+S3 in one process). S3 identities come from the Secret
# `seaweedfs-s3-config` created by scripts/make_secrets.sh (never committed).
apiVersion: v1
kind: PersistentVolumeClaim
metadata: {name: seaweedfs-data, namespace: data}
spec:
  accessModes: [ReadWriteOnce]
  resources: {requests: {storage: 2Gi}}
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: seaweedfs, namespace: data}
spec:
  replicas: 1
  strategy: {type: Recreate}
  selector: {matchLabels: {app: seaweedfs}}
  template:
    metadata: {labels: {app: seaweedfs}}
    spec:
      containers:
        - name: seaweedfs
          image: chrislusf/seaweedfs:3.80
          args: ["server", "-dir=/data", "-s3", "-s3.port=8333", "-s3.config=/etc/s3/s3.json", "-volume.max=20"]
          ports: [{containerPort: 8333, name: s3}]
          volumeMounts:
            - {name: data, mountPath: /data}
            - {name: s3cfg, mountPath: /etc/s3, readOnly: true}
          readinessProbe: {tcpSocket: {port: 8333}, initialDelaySeconds: 5, periodSeconds: 5}
          resources: {requests: {cpu: 100m, memory: 256Mi}, limits: {memory: 1Gi}}
      volumes:
        - {name: data, persistentVolumeClaim: {claimName: seaweedfs-data}}
        - {name: s3cfg, secret: {secretName: seaweedfs-s3-config}}
---
apiVersion: v1
kind: Service
metadata: {name: seaweedfs-s3, namespace: data}
spec:
  selector: {app: seaweedfs}
  ports: [{port: 8333, targetPort: 8333, name: s3}]
