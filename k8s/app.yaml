apiVersion: apps/v1
kind: Deployment
metadata: {name: parser, namespace: app}
spec:
  replicas: 2
  revisionHistoryLimit: 5
  strategy: {type: RollingUpdate, rollingUpdate: {maxSurge: 1, maxUnavailable: 0}}
  selector: {matchLabels: {app: parser}}
  template:
    metadata: {labels: {app: parser}}
    spec:
      containers:
        - name: parser
          image: parser-service:local
          imagePullPolicy: IfNotPresent
          ports: [{containerPort: 8000}]
          env:
            - {name: MODEL_VERSION, value: "v1"}
            - {name: MODEL_URI, value: "s3://models/v1/"}
            - {name: S3_ENDPOINT, value: "http://seaweedfs-s3.data.svc.cluster.local:8333"}
            - {name: MAX_NEW_TOKENS, value: "64"}
            - name: AWS_ACCESS_KEY_ID
              valueFrom: {secretKeyRef: {name: s3-credentials, key: AWS_ACCESS_KEY_ID}}
            - name: AWS_SECRET_ACCESS_KEY
              valueFrom: {secretKeyRef: {name: s3-credentials, key: AWS_SECRET_ACCESS_KEY}}
          resources:
            requests: {cpu: 500m, memory: 512Mi}
            limits: {cpu: "1", memory: 1Gi}
          livenessProbe: {httpGet: {path: /healthz, port: 8000}, initialDelaySeconds: 10, periodSeconds: 10, failureThreshold: 3}
          readinessProbe: {httpGet: {path: /readyz, port: 8000}, initialDelaySeconds: 3, periodSeconds: 3, failureThreshold: 2}
---
apiVersion: v1
kind: Service
metadata: {name: parser, namespace: app}
spec:
  selector: {app: parser}
  ports: [{port: 80, targetPort: 8000}]
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata: {name: parser, namespace: app}
spec:
  rules:
    - http:
        paths:
          - {path: /parse, pathType: Prefix, backend: {service: {name: parser, port: {number: 80}}}}
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata: {name: parser, namespace: app}
spec:
  scaleTargetRef: {apiVersion: apps/v1, kind: Deployment, name: parser}
  minReplicas: 1
  maxReplicas: 2
  metrics:
    - type: Resource
      resource: {name: cpu, target: {type: Utilization, averageUtilization: 70}}
