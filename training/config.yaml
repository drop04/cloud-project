# Everything `make train` needs. Edit here only.
seed: 42
model_name: EleutherAI/pythia-70m
learning_rate: 5.0e-5
batch_size: 8
epochs: 3
max_seq_len: 128
max_records: 1500          # spec: first 1,500 records of the cleaned dataset
train_file: data/train.jsonl   # downloaded from s3://datasets/v1/train.jsonl by `make fetch-train`
output_dir: models/v1
loss_csv: training/loss.csv
versions:                  # recorded for reproducibility; train.py logs the actual ones too
  python: "3.11"
  torch: "2.5.1"
  transformers: "4.46.3"
  numpy: "1.26.4"
  pyyaml: "6.0.2"
